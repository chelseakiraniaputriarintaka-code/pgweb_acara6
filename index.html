<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leaflet JS</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
        html,
        body,
        #map {
            width: 100%;
            height: 100%;
            margin: 0;
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        // Inisialisasi peta
        var map = L.map("map").setView([-8.3134426, 123.1649780], 11);

        // Tile Layer Base Map
        var basemap = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution:
                '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        });

        // Menambahkan basemap ke dalam peta
        basemap.addTo(map);

        // =========================================================================
        // 1. GeoJSON Point Toponimi
        // =========================================================================
        var toponimi = L.geoJSON(null, {
            // Style
            pointToLayer: function (feature, latlng) {
                return L.marker(latlng, {
                    icon: L.icon({
                        iconUrl: "images/home_marker.png", // icon marker
                        iconSize: [48, 48], // ukuran icon
                        iconAnchor: [24, 48], // posisi icon terhadap titik (point)
                        popupAnchor: [0, -48], // posisi popup terhadap icon
                        tooltipAnchor: [-16, -30], // posisi tooltip terhadap icon
                    }),
                });
            },
            // onEachFeature
            onEachFeature: function (feature, layer) {
                // variable popup content
                var popup_content = "<img src='images/" + feature.properties.image + "' alt='' width='200'>" + "<br>" +
                    "Nama: " + feature.properties.TOPONIMI + "<br>" +
                    "Koordinat: " + feature.geometry.coordinates[1] + ", " + feature.geometry.coordinates[0] + "<br>";

                // PERBAIKAN: Langsung bind popup ke layer
                layer.bindPopup(popup_content);

                // PERBAIKAN: Tooltip menggunakan layer, bukan variabel toponimi
                layer.on({
                    mouseover: function (e) {
                        layer.bindTooltip(feature.properties.TOPONIMI, {
                            direction: "left",
                            sticky: true,
                        });
                    },
                });
            },
        });

        $.getJSON("GeoJSON/toponimi.geojson", function (data) {
            toponimi.addData(data); // Menambahkan data ke dalam GeoJSON
            map.addLayer(toponimi); // Menambahkan GeoJSON ke dalam peta
        });

        // =========================================================================
        // 2. GeoJSON Polyline Jalan
        // =========================================================================
        var jalan = L.geoJSON(null, {
            // Style
            style: function (feature) {
                return {
                    color: "red",
                    opacity: 1,
                    weight: 3,
                };
            },
            // onEachFeature
            onEachFeature: function (feature, layer) {
                // variable popup content
                var popup_content = "Fungsi: " + feature.properties.NAMA_UNSUR + "<br>" +
                    "Panjang (km): " + feature.properties.panjang_km;

                // PERBAIKAN: Langsung bind popup ke layer
                layer.bindPopup(popup_content);

                // PERBAIKAN: Tooltip menggunakan layer
                layer.on({
                    mouseover: function (e) {
                        layer.bindTooltip(feature.properties.NAMA_UNSUR, {
                            direction: "auto",
                            sticky: true,
                        });
                    },
                });
            },
        });
        
        $.getJSON("GeoJSON/jalan.geojson", function (data) {
            jalan.addData(data); 
            map.addLayer(jalan); 
        });

        // =========================================================================
        // 3. GeoJSON Polygon Jumlah Penduduk
        // =========================================================================
        var jumlah_penduduk = L.geoJSON(null, {
            // Style
            style: function (feature) {
                if (feature.properties.Penduduk <= 12000) {
                    return { opacity: 1, color: 'black', weight: 1.0, fillOpacity: 0.7, fillColor: '#ffffb2' };
                }
                if (feature.properties.Penduduk > 12000 && feature.properties.Penduduk <= 24000) {
                    return { opacity: 1, color: 'black', weight: 1.0, fillOpacity: 0.7, fillColor: '#fd8d3c' };
                }
                if (feature.properties.Penduduk > 24000) {
                    return { opacity: 1, color: 'black', weight: 1.0, fillOpacity: 0.7, fillColor: '#bd0026' };
                }
            },
            
            // onEachFeature (Sudah dibersihkan dari duplikasi)
            onEachFeature: function (feature, layer) {
                var popup_content = "Kecamatan: " + feature.properties.WADMKC + "<br>" +
                    "Jumlah Penduduk: " + feature.properties.Penduduk;

                // PERBAIKAN: Langsung bind popup ke layer
                layer.bindPopup(popup_content);

                // PERBAIKAN: Tooltip menggunakan layer dan toString()
                layer.on({
                    mouseover: function (e) {
                        layer.bindTooltip(feature.properties.Penduduk.toString(), {
                            direction: "auto",
                            sticky: true,
                        });
                    },
                });
            },
        });

        $.getJSON("GeoJSON/jml_pddk.geojson", function (data) {
            jumlah_penduduk.addData(data);
            map.addLayer(jumlah_penduduk); 
        });

        // Control Layer
        var baseMaps = {
            "OpenStreetMap": basemap,
        };

        // PERBAIKAN: Gunakan nama variabel GeoJSON yang sudah Anda buat sebelumnya
        var overlayMaps = {
            "Toponimi": toponimi,           // Sebelumnya: marker
            "Jalan": jalan,                 // Sebelumnya: circle
            "Jumlah Penduduk": jumlah_penduduk, // Sebelumnya: polyline
        };

        var controllayer = L.control.layers(baseMaps, overlayMaps);
        controllayer.addTo(map);

    </script>
</body>

</html>
